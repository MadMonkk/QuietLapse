name: Build QuietLapse APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/QuietLapse_Version_0.6.5.apk

      - name: Upload named APK
        uses: actions/upload-artifact@v4
        with:
          name: QuietLapse_Version_0.6.5
          path: app/build/outputs/apk/debug/QuietLapse_Version_0.6.5.apk
